name: Build and release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore ODT-ItemInfo-4.0.sln

      - name: Build
        run: dotnet build ODT-ItemInfo-4.0.sln --configuration Release --no-restore /p:StagingDir="${{ github.workspace }}/release/SPT/user/mods/ODT-ItemInfo-4.0"

      - name: Package mod
        shell: bash
        run: |
          mkdir -p release
          cp -a release/SPT release-package/
          cd release-package
          zip -r "../ODT-ItemInfo-4.0-${GITHUB_REF_NAME}.zip" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ODT-ItemInfo-4.0-${{ github.ref_name }}
          path: ODT-ItemInfo-4.0-*.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ODT-ItemInfo-4.0-*.zip
